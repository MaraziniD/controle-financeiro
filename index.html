<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Meu Financeiro</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#181b22;
    --card2:#20242e;
    --text:#f2f3f5;
    --muted:#9aa1ac;
    --accent:#22c55e;
    --danger:#ef4444;
    --border:#2a2f3a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{padding-bottom:40px;}
  .wrap{max-width:480px;margin:0 auto;padding:16px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  header h1{font-size:20px;margin:0;display:flex;align-items:center;gap:8px;}
  .gear{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:6px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;}
  .balance-label{color:var(--muted);font-size:13px;margin-bottom:4px;}
  .balance-value{font-size:34px;font-weight:700;letter-spacing:-0.5px;}
  .balance-value.negative{color:var(--danger);}
  .sub-row{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--muted);}
  .sub-row b{color:var(--text);font-weight:600;}
  .warning-banner{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.4;}
  .warning-banner.hidden{display:none;}
  .warning-banner.caution{background:rgba(249,115,22,.15);color:#f97316;border:1px solid rgba(249,115,22,.35);}
  .warning-banner.danger{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.35);}
  .bar-track{height:8px;border-radius:999px;background:var(--card2);margin-top:10px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .3s ease;}
  .bar-fill.over{background:var(--danger);}
  form.quick{display:flex;gap:8px;margin-bottom:12px;}
  .quick input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:14px;font-size:16px;}
  .quick input:focus{outline:none;border-color:var(--accent);}
  .quick button{background:var(--accent);border:none;color:#08120a;font-weight:700;font-size:22px;width:52px;border-radius:12px;cursor:pointer;}
  .quick .mic{background:var(--card2);color:var(--text);border:1px solid var(--border);font-size:20px;width:52px;border-radius:12px;cursor:pointer;flex-shrink:0;}
  .quick .mic.listening{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1.2s infinite;}
  .quick .mic.hidden{display:none;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5);}70%{box-shadow:0 0 0 10px rgba(239,68,68,0);}100%{box-shadow:0 0 0 0 rgba(239,68,68,0);}}
  .hint{color:var(--muted);font-size:12px;margin:-4px 0 16px 4px;}
  .toast{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:16px;font-size:14px;}
  .toast .cat-icon{font-size:18px;}
  .toast select{margin-left:auto;background:transparent;color:var(--accent);border:none;font-size:13px;font-weight:600;}
  .day-group{margin-bottom:6px;}
  .day-label{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px 4px;}
  .item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;}
  .item .icon{font-size:20px;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .item .info{flex:1;min-width:0;}
  .item .desc{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .cat-select{border:none;background:transparent;color:var(--muted);font-size:12px;padding:0;margin-top:2px;}
  .item .amount{font-weight:700;font-size:15px;white-space:nowrap;}
  .item .del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 6px;}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;}
  .modal-bg.hidden{display:none;}
  .modal{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:24px;}
  .modal h2{margin:0 0 14px 0;font-size:17px;}
  .modal input{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:14px;font-size:16px;margin-bottom:14px;}
  .modal .row{display:flex;gap:10px;}
  .modal button{flex:1;padding:14px;border-radius:10px;border:none;font-weight:700;font-size:15px;cursor:pointer;}
  .modal .save{background:var(--accent);color:#08120a;}
  .modal .cancel{background:var(--card2);color:var(--text);}
  .modal .suggest{background:none;border:none;color:var(--accent);font-size:13px;margin:-8px 0 14px 0;padding:0;cursor:pointer;}
  #reportView.hidden,#mainView.hidden{display:none;}
  .report-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .back-btn{background:none;border:none;color:var(--text);font-size:15px;cursor:pointer;padding:6px 4px 6px 0;}
  .report-header h2{font-size:18px;margin:0;flex:1;}
  .month-select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:20px;}
  .donut-wrap{display:flex;justify-content:center;align-items:center;position:relative;margin-bottom:20px;min-height:180px;}
  .donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
  .donut-center .total{font-size:17px;font-weight:700;}
  .donut-center .label{font-size:11px;color:var(--muted);}
  .legend-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
  .legend-row:last-child{border-bottom:none;}
  .legend-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .legend-name{flex:1;font-size:14px;}
  .legend-pct{color:var(--muted);font-size:12px;margin-right:10px;}
  .legend-amount{font-weight:600;font-size:14px;white-space:nowrap;}
</style>
</head>
<body>
<div class="wrap">
  <div id="mainView">
  <header>
    <h1>💰 Meu Financeiro</h1>
    <div style="display:flex;gap:4px;">
      <button class="gear" id="btnReports" aria-label="Ver relatórios">📊</button>
      <button class="gear" id="btnSettings" aria-label="Configurar orçamento">⚙️</button>
    </div>
  </header>

  <div class="card">
    <div class="balance-label">Saldo do mês</div>
    <div class="balance-value" id="balanceValue">R$ 0,00</div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="sub-row">
      <span>Orçamento: <b id="budgetValue">R$ 0,00</b></span>
      <span>Gasto: <b id="spentValue">R$ 0,00</b></span>
    </div>
    <div class="warning-banner hidden" id="warningBanner"></div>
  </div>

  <form class="quick" id="quickForm">
    <input id="quickInput" type="text" inputmode="text" placeholder="ex: almoço 35" autocomplete="off">
    <button type="button" class="mic hidden" id="btnMic" aria-label="Falar gasto">🎤</button>
    <button type="submit">+</button>
  </form>
  <div class="hint" id="hintText">Digite o gasto e o valor, ex: "uber 18,90"</div>

  <div id="toastArea"></div>
  <div id="list"></div>
  </div>

  <div id="reportView" class="hidden">
    <div class="report-header">
      <button class="back-btn" id="btnReportBack">← Voltar</button>
      <h2>Relatórios</h2>
    </div>
    <select class="month-select" id="reportMonthSelect"></select>
    <div class="donut-wrap" id="donutWrap"></div>
    <div id="legendList"></div>
  </div>
</div>

<div class="modal-bg hidden" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">Orçamento do mês</h2>
    <button class="suggest hidden" id="btnSuggest"></button>
    <input id="budgetInput" type="number" inputmode="decimal" placeholder="Ex: 3000">
    <div class="row">
      <button class="cancel" id="btnCancel">Cancelar</button>
      <button class="save" id="btnSave">Salvar</button>
    </div>
  </div>
</div>

<script>
(function(){
  var CATS = {
    'Alimentação': {icon:'🍽️', color:'#f97316'},
    'Transporte': {icon:'🚗', color:'#3b82f6'},
    'Lazer': {icon:'🎉', color:'#a855f7'},
    'Contas': {icon:'🧾', color:'#14b8a6'},
    'Outros': {icon:'📦', color:'#6b7280'}
  };

  var KEYWORDS = {
    'Alimentação': ['almoco','almoço','janta','jantar','cafe','café','lanche','mercado','restaurante','ifood','rappi','padaria','pizza','comida','feira','lanchonete','churrasco','acai','açai','sorvete','delivery','marmita','sushi','hamburguer','burguer','padoca','bar do'],
    'Transporte': ['uber','99','taxi','gasolina','combustivel','combustível','estacionamento','onibus','ônibus','metro','metrô','trem','passagem','pedagio','pedágio','carro','moto','bike','patinete'],
    'Lazer': ['cinema','bar','balada','show','viagem','netflix','spotify','jogo','streaming','festa','ingresso','parque','passeio','bilhar','boliche','presente'],
    'Contas': ['luz','agua','água','internet','telefone','celular','aluguel','condominio','condomínio','conta','boleto','academia','assinatura','plano','seguro','imposto','iptu','ipva','financiamento','cartao','cartão','fatura','farmacia','farmácia','remedio','remédio']
  };

  function normalize(s){
    return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  }

  function categorize(desc){
    var n = normalize(desc);
    for (var cat in KEYWORDS){
      for (var i=0;i<KEYWORDS[cat].length;i++){
        if (n.indexOf(normalize(KEYWORDS[cat][i])) !== -1) return cat;
      }
    }
    return 'Outros';
  }

  function parseQuickInput(text){
    text = text.replace(/\breais?\b/gi, '').replace(/\br\$\s*/gi, '');
    var match = text.match(/(\d+(?:[.,]\d{1,2})?)(?!.*\d)/);
    if (!match) return null;
    var amount = parseFloat(match[1].replace(',', '.'));
    if (isNaN(amount) || amount <= 0) return null;
    var desc = (text.slice(0, match.index) + text.slice(match.index + match[0].length)).trim();
    desc = desc.replace(/^r\$\s*/i,'').replace(/\s{2,}/g,' ').trim();
    if (!desc) desc = 'Gasto';
    desc = desc.charAt(0).toUpperCase() + desc.slice(1);
    return {amount: amount, desc: desc};
  }

  function monthKey(d){
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }

  function fmtMoney(v){
    return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
  }

  function load(key, fallback){
    try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch(e){ return fallback; }
  }
  function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

  var budgets = load('financas.budgets', {});
  var expenses = load('financas.expenses', []);

  var els = {
    balanceValue: document.getElementById('balanceValue'),
    barFill: document.getElementById('barFill'),
    budgetValue: document.getElementById('budgetValue'),
    spentValue: document.getElementById('spentValue'),
    warningBanner: document.getElementById('warningBanner'),
    list: document.getElementById('list'),
    toastArea: document.getElementById('toastArea'),
    quickForm: document.getElementById('quickForm'),
    quickInput: document.getElementById('quickInput'),
    modalBg: document.getElementById('modalBg'),
    modalTitle: document.getElementById('modalTitle'),
    budgetInput: document.getElementById('budgetInput'),
    btnSettings: document.getElementById('btnSettings'),
    btnCancel: document.getElementById('btnCancel'),
    btnSave: document.getElementById('btnSave'),
    btnSuggest: document.getElementById('btnSuggest'),
    btnMic: document.getElementById('btnMic'),
    hintText: document.getElementById('hintText'),
    mainView: document.getElementById('mainView'),
    reportView: document.getElementById('reportView'),
    btnReports: document.getElementById('btnReports'),
    btnReportBack: document.getElementById('btnReportBack'),
    reportMonthSelect: document.getElementById('reportMonthSelect'),
    donutWrap: document.getElementById('donutWrap'),
    legendList: document.getElementById('legendList')
  };

  function currentMonthExpenses(){
    var mk = monthKey();
    return expenses.filter(function(e){ return monthKey(new Date(e.date)) === mk; });
  }

  function render(){
    var mk = monthKey();
    var budget = budgets[mk] || 0;
    var monthExpenses = currentMonthExpenses();
    var spent = monthExpenses.reduce(function(s,e){ return s + e.amount; }, 0);
    var balance = budget - spent;

    els.balanceValue.textContent = fmtMoney(balance);
    els.balanceValue.className = 'balance-value' + (balance < 0 ? ' negative' : '');
    els.budgetValue.textContent = fmtMoney(budget);
    els.spentValue.textContent = fmtMoney(spent);

    var pct = budget > 0 ? Math.min(100, (spent/budget)*100) : (spent>0 ? 100 : 0);
    els.barFill.style.width = pct + '%';
    els.barFill.className = 'bar-fill' + (spent > budget && budget > 0 ? ' over' : '');

    renderWarning(budget, spent);
    renderList(monthExpenses);
  }

  function renderWarning(budget, spent){
    if (budget <= 0){
      els.warningBanner.className = 'warning-banner hidden';
      return;
    }
    var ratio = spent / budget;
    if (ratio >= 1){
      els.warningBanner.className = 'warning-banner danger';
      els.warningBanner.textContent = '🚨 Orçamento estourado em ' + fmtMoney(spent - budget) + '.';
    } else if (ratio >= 0.8){
      els.warningBanner.className = 'warning-banner caution';
      els.warningBanner.textContent = '⚠️ Você já usou ' + Math.round(ratio*100) + '% do orçamento do mês. Restam ' + fmtMoney(budget - spent) + '.';
    } else {
      els.warningBanner.className = 'warning-banner hidden';
    }
  }

  function renderList(monthExpenses){
    els.list.innerHTML = '';
    if (monthExpenses.length === 0){
      els.list.innerHTML = '<div class="empty">Nenhum gasto registrado este mês.<br>Digite algo como "almoço 35" acima.</div>';
      return;
    }
    var sorted = monthExpenses.slice().sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
    var groups = {};
    var order = [];
    sorted.forEach(function(e){
      var d = new Date(e.date);
      var label = dayLabel(d);
      if (!groups[label]){ groups[label] = []; order.push(label); }
      groups[label].push(e);
    });
    order.forEach(function(label){
      var g = document.createElement('div');
      g.className = 'day-group';
      var lbl = document.createElement('div');
      lbl.className = 'day-label';
      lbl.textContent = label;
      g.appendChild(lbl);
      groups[label].forEach(function(e){
        g.appendChild(renderItem(e));
      });
      els.list.appendChild(g);
    });
  }

  function dayLabel(d){
    var today = new Date();
    var yesterday = new Date(); yesterday.setDate(today.getDate()-1);
    if (d.toDateString() === today.toDateString()) return 'Hoje';
    if (d.toDateString() === yesterday.toDateString()) return 'Ontem';
    return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
  }

  function renderItem(e){
    var row = document.createElement('div');
    row.className = 'item';

    var icon = document.createElement('div');
    icon.className = 'icon';
    var catInfo = CATS[e.category] || CATS['Outros'];
    icon.style.background = catInfo.color + '26';
    icon.textContent = catInfo.icon;
    row.appendChild(icon);

    var info = document.createElement('div');
    info.className = 'info';
    var desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = e.text;
    info.appendChild(desc);

    var sel = document.createElement('select');
    sel.className = 'cat-select';
    Object.keys(CATS).forEach(function(c){
      var opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      if (c === e.category) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', function(){
      e.category = sel.value;
      save('financas.expenses', expenses);
      render();
    });
    info.appendChild(sel);
    row.appendChild(info);

    var amount = document.createElement('div');
    amount.className = 'amount';
    amount.textContent = fmtMoney(e.amount);
    row.appendChild(amount);

    var del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.addEventListener('click', function(){
      expenses = expenses.filter(function(x){ return x.id !== e.id; });
      save('financas.expenses', expenses);
      render();
    });
    row.appendChild(del);

    return row;
  }

  function showToast(e){
    els.toastArea.innerHTML = '';
    var t = document.createElement('div');
    t.className = 'toast';
    var catInfo = CATS[e.category];
    t.innerHTML = '<span class="cat-icon">' + catInfo.icon + '</span> <span>' + e.text + ' — ' + fmtMoney(e.amount) + '</span>';
    var sel = document.createElement('select');
    Object.keys(CATS).forEach(function(c){
      var opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      if (c === e.category) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', function(){
      e.category = sel.value;
      save('financas.expenses', expenses);
      render();
      els.toastArea.innerHTML = '';
    });
    t.appendChild(sel);
    els.toastArea.appendChild(t);
    setTimeout(function(){
      if (els.toastArea.contains(t)) els.toastArea.innerHTML = '';
    }, 4000);
  }

  els.quickForm.addEventListener('submit', function(ev){
    ev.preventDefault();
    var text = els.quickInput.value.trim();
    if (!text) return;
    var parsed = parseQuickInput(text);
    if (!parsed){
      els.quickInput.placeholder = 'Não entendi... ex: "almoço 35"';
      els.quickInput.value = '';
      return;
    }
    var category = categorize(parsed.desc);
    var expense = {
      id: Date.now() + '_' + Math.random().toString(36).slice(2,7),
      text: parsed.desc,
      amount: parsed.amount,
      category: category,
      date: new Date().toISOString()
    };
    expenses.push(expense);
    save('financas.expenses', expenses);
    els.quickInput.value = '';
    render();
    showToast(expense);
  });

  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognitionCtor){
    els.btnMic.classList.remove('hidden');
    var recognition = new SpeechRecognitionCtor();
    recognition.lang = 'pt-BR';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    var listening = false;
    var defaultHint = els.hintText.textContent;

    recognition.onstart = function(){
      listening = true;
      els.btnMic.classList.add('listening');
      els.hintText.textContent = 'Ouvindo... fale o gasto, ex: "uber 36 reais"';
    };
    recognition.onresult = function(ev){
      var transcript = ev.results[0][0].transcript;
      els.quickInput.value = transcript;
      if (els.quickForm.requestSubmit) els.quickForm.requestSubmit();
      else els.quickForm.dispatchEvent(new Event('submit', {cancelable:true, bubbles:true}));
    };
    recognition.onerror = function(){
      els.hintText.textContent = 'Não consegui ouvir. Tente de novo ou digite o gasto.';
    };
    recognition.onend = function(){
      listening = false;
      els.btnMic.classList.remove('listening');
      setTimeout(function(){ els.hintText.textContent = defaultHint; }, 2500);
    };

    els.btnMic.addEventListener('click', function(){
      if (listening){ recognition.stop(); return; }
      try { recognition.start(); } catch(e){}
    });
  }

  var settingsMode = 'budget';
  function openBudgetModal(){
    settingsMode = 'budget';
    var mk = monthKey();
    els.modalTitle.textContent = 'Orçamento de ' + new Date().toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
    els.budgetInput.value = budgets[mk] || '';

    var prevDate = new Date(); prevDate.setMonth(prevDate.getMonth()-1);
    var prevKey = monthKey(prevDate);
    if (budgets[prevKey] && !budgets[mk]){
      els.btnSuggest.classList.remove('hidden');
      els.btnSuggest.textContent = 'Usar mesmo do mês anterior: ' + fmtMoney(budgets[prevKey]);
      els.btnSuggest.onclick = function(){ els.budgetInput.value = budgets[prevKey]; };
    } else {
      els.btnSuggest.classList.add('hidden');
    }
    els.modalBg.classList.remove('hidden');
    setTimeout(function(){ els.budgetInput.focus(); }, 50);
  }

  els.btnSettings.addEventListener('click', openBudgetModal);
  els.btnCancel.addEventListener('click', function(){ els.modalBg.classList.add('hidden'); });
  els.btnSave.addEventListener('click', function(){
    var v = parseFloat(els.budgetInput.value);
    if (isNaN(v) || v < 0) return;
    budgets[monthKey()] = v;
    save('financas.budgets', budgets);
    els.modalBg.classList.add('hidden');
    render();
  });

  function getAvailableMonths(){
    var set = {};
    expenses.forEach(function(e){ set[monthKey(new Date(e.date))] = true; });
    set[monthKey()] = true;
    return Object.keys(set).sort().reverse();
  }

  function monthLabel(mk){
    var parts = mk.split('-');
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, 1);
    var label = d.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
    return label.charAt(0).toUpperCase() + label.slice(1);
  }

  function renderReport(mk){
    var monthExpenses = expenses.filter(function(e){ return monthKey(new Date(e.date)) === mk; });
    var totals = {};
    Object.keys(CATS).forEach(function(c){ totals[c] = 0; });
    monthExpenses.forEach(function(e){ totals[e.category] = (totals[e.category] || 0) + e.amount; });
    var total = monthExpenses.reduce(function(s,e){ return s + e.amount; }, 0);
    var sortedCats = Object.keys(totals).filter(function(c){ return totals[c] > 0; }).sort(function(a,b){ return totals[b]-totals[a]; });

    if (total === 0){
      els.donutWrap.innerHTML = '<div class="empty">Sem gastos registrados nesse mês.</div>';
      els.legendList.innerHTML = '';
      return;
    }

    var r = 70, sw = 24, circumference = 2 * Math.PI * r;
    var svg = '<svg viewBox="0 0 180 180" width="180" height="180">';
    var cumulative = 0;
    sortedCats.forEach(function(c){
      var pct = totals[c] / total;
      var dash = pct * circumference;
      svg += '<circle cx="90" cy="90" r="' + r + '" fill="none" stroke="' + CATS[c].color + '" stroke-width="' + sw + '" stroke-dasharray="' + dash.toFixed(2) + ' ' + (circumference - dash).toFixed(2) + '" stroke-dashoffset="' + (-cumulative * circumference).toFixed(2) + '" transform="rotate(-90 90 90)"/>';
      cumulative += pct;
    });
    svg += '</svg>';
    els.donutWrap.innerHTML = svg + '<div class="donut-center"><div class="total">' + fmtMoney(total) + '</div><div class="label">total no mês</div></div>';

    els.legendList.innerHTML = '';
    sortedCats.forEach(function(c){
      var pct = Math.round(totals[c] / total * 100);
      var row = document.createElement('div');
      row.className = 'legend-row';
      row.innerHTML = '<span class="legend-dot" style="background:' + CATS[c].color + '"></span>'
        + '<span class="legend-name">' + CATS[c].icon + ' ' + c + '</span>'
        + '<span class="legend-pct">' + pct + '%</span>'
        + '<span class="legend-amount">' + fmtMoney(totals[c]) + '</span>';
      els.legendList.appendChild(row);
    });
  }

  function openReportView(){
    var months = getAvailableMonths();
    els.reportMonthSelect.innerHTML = '';
    months.forEach(function(mk){
      var opt = document.createElement('option');
      opt.value = mk; opt.textContent = monthLabel(mk);
      if (mk === monthKey()) opt.selected = true;
      els.reportMonthSelect.appendChild(opt);
    });
    renderReport(monthKey());
    els.mainView.classList.add('hidden');
    els.reportView.classList.remove('hidden');
  }

  function closeReportView(){
    els.reportView.classList.add('hidden');
    els.mainView.classList.remove('hidden');
  }

  els.btnReports.addEventListener('click', openReportView);
  els.btnReportBack.addEventListener('click', closeReportView);
  els.reportMonthSelect.addEventListener('change', function(){
    renderReport(els.reportMonthSelect.value);
  });

  render();
  if (!budgets[monthKey()]){
    openBudgetModal();
  }
})();
</script>
</body>
</html>
